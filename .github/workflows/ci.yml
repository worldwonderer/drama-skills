name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercise the declared Python floor and the newest supported CI runtime.
  # The tests use unittest directly, so CI does not install a second test runner.
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit tests
        run: python -B -m unittest discover -s tests -v

  windows-install:
    name: Windows CRLF installation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Windows regressions for issues 26 and 27
        run: >-
          python -B -m unittest
          tests.test_installation_resolution
          tests.test_episode_intake
          -v
      - name: Verify checked-out suite
        run: python tools/verify_suite.py skills/short-drama

  # Tool versions are pinned on purpose. This repository has no dependency
  # manifest, so an unpinned `pip install ruff` turns main red the next time
  # ruff changes its default rule set — with nobody having touched the code.
  # Bumping these is a deliberate pull request, not a surprise.
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: suite manifest matches the shipped tree
        run: python tools/verify_suite.py skills/short-drama
      - run: python -m pip install --disable-pip-version-check ruff==0.15.11 mypy==2.3.0
      - name: ruff
        run: ruff check skills tests tools
      - name: mypy
        run: >
          mypy skills/short-drama/scripts/project_tool.py
          skills/short-drama/scripts/dashboard_server.py
          skills/short-drama-develop/scripts/episode_intake.py
          --ignore-missing-imports
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: dashboard script parses
        run: node --check skills/short-drama/assets/dashboard/app.js
